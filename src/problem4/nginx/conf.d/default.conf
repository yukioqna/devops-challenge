server {
    listen 80;

    # Bug 2 fix: use Docker's internal DNS resolver with short TTL
    # so nginx re-resolves "api" after container restarts (new IP)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api http://api:3000;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        proxy_pass $upstream_api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

}
